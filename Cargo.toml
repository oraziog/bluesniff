[package]
name = "bluesniff"
version = "0.1.0"
authors = ["Germenà Orazio <oraziog67@gmail.com>"]
edition = '2021'
description = "Passive/active monitor of the Bluetooth devices around a Windows PC, with a local web dashboard, proximity radar and push notifications."
keywords = ["bluetooth", "bluetooth-le", "scanner", "rust", "bluesniff", "dashboard"]
categories = ["network-programming", "hardware-support"]
license = "MIT"
repository = "https://github.com/oraziog/bluesniff"
homepage = "https://github.com/oraziog/bluesniff#readme"

[dependencies]
btleplug = "0.11.6"
tokio = { version = "1", features = ["full"] }
ipnet = "2.10"
regex = "1"
socket2 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
axum = "0.8"
mdns-sd = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Devices_Radios",
    "Storage_Streams",
] }
